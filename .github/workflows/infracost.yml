name: 'Infracost Price Estimator'

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write # Grants permissions to write the cost table directly to the PR comments

env:
  TF_ROOT: . 

jobs:
  infracost:
    name: 'Estimate Costs'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4

      # THE REPLACEMENT ACTION ENGINE: Runs fully isolated in one execution pass
      - name: Run Infracost Diff Engine
        uses: infracost/actions/diff@v3
        with:
          path: ${{ env.TF_ROOT }}
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          behavior: update
